<section class="scratch-section">

  <div class="eyebrow">

  </div>

  <h2 class="section-title">
    Scratch to reveal

  <p class="section-copy">

    Gently scratch to reveal our celebration.
  </p>

  <div class="scratch-wrap scratch-medallion">

    <div class="medallion-content">

      <span class="medallion-ornament" aria-hidden="true">
        ❦
      </span>

      <span class="heart-caption">
        WITH LOVE
      </span>

      <strong id="reveal-date">
        10 JANUARY 2027
      </strong>

      <span id="reveal-label">
        OUR CELEBRATION
      </span>

      <span class="medallion-ornament medallion-ornament-bottom" aria-hidden="true">
        ❦
      </span>

    </div>

    <canvas
      id="scratch"
      aria-label="Scratch to reveal our celebration date"
    ></canvas>

  </div>

</section>
