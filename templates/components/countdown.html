<div class="wedding-countdown">

  <div
    class="eyebrow countdown-heading"
    id="countdown-label"
  >
    Counting down to our celebration
  </div>

  <div
    class="countdown"
    id="countdown"
    aria-label="Countdown to our celebration"
  >
    <div>
      <strong id="days">—</strong>
      <small>Days</small>
    </div>

    <div>
      <strong id="hours">—</strong>
      <small>Hours</small>
    </div>

    <div>
      <strong id="minutes">—</strong>
      <small>Minutes</small>
    </div>

    <div>
      <strong id="seconds">—</strong>
      <small>Seconds</small>
    </div>
  </div>

</div>
